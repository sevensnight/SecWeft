{{- if .Values.validationWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulnlab.fullname" . }}-validation-worker
  labels:
    {{- include "vulnlab.labels" . | nindent 4 }}
    app.kubernetes.io/component: validation-worker
spec:
  {{- if not .Values.validationWorker.autoscaling.enabled }}
  replicas: {{ .Values.validationWorker.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.validationWorker.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.validationWorker.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "vulnlab.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: validation-worker
  template:
    metadata:
      annotations:
        checksum/control-plane-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "vulnlab.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: validation-worker
    spec:
      serviceAccountName: {{ include "vulnlab.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.validationWorker.gracefulShutdownSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: validation-worker
          image: "{{ .Values.validationWorker.image.repository }}:{{ .Values.validationWorker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            {{- toYaml .Values.validationWorker.command | nindent 12 }}
          args:
            {{- toYaml .Values.validationWorker.args | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "vulnlab.fullname" . }}-control-plane
            - secretRef:
                name: {{ include "vulnlab.secretName" . }}
          env:
            - name: VULNLAB_VALIDATION_WORKER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; assert os.getenv('VULNLAB_VALIDATION_WORKER_INSTANCE_ID')"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 15
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.validationWorker.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- if .Values.global.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.global.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.global.topologySpreadConstraints.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.global.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "vulnlab.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: validation-worker
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "vulnlab.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: validation-worker
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
