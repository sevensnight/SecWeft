apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulnlab.fullname" . }}-control-plane
  labels:
    {{- include "vulnlab.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.controlPlane.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.controlPlane.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "vulnlab.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      annotations:
        checksum/control-plane-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "vulnlab.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: {{ include "vulnlab.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.controlPlane.gracefulShutdownSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "vulnlab.fullname" . }}-control-plane
          env:
            - name: VULNLAB_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulnlab.secretName" . }}
                  key: VULNLAB_ADMIN_KEY
            - name: VULNLAB_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulnlab.secretName" . }}
                  key: VULNLAB_MASTER_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulnlab.secretName" . }}
                  key: DATABASE_URL
            - name: VULNLAB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulnlab.secretName" . }}
                  key: VULNLAB_DATABASE_URL
            - name: VULNLAB_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulnlab.secretName" . }}
                  key: VULNLAB_NATS_URL
            - name: VULNLAB_MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulnlab.secretName" . }}
                  key: VULNLAB_MINIO_ENDPOINT
            - name: VULNLAB_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulnlab.secretName" . }}
                  key: VULNLAB_MINIO_ACCESS_KEY
            - name: VULNLAB_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulnlab.secretName" . }}
                  key: VULNLAB_MINIO_SECRET_KEY
            - name: VULNLAB_CONTROL_PLANE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.controlPlane.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-control-plane" (include "vulnlab.fullname" .)) .Values.controlPlane.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- if .Values.global.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.global.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.global.topologySpreadConstraints.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.global.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "vulnlab.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: control-plane
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "vulnlab.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: control-plane
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
