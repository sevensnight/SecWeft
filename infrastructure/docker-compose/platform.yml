name: vulnlab-platform

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      VULNLAB_OIDC_BROWSER_ORIGIN: ${VULNLAB_OIDC_BROWSER_ORIGIN:-http://127.0.0.1:8081}
    ports:
      - "${PLATFORM_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web-console:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /config:size=8m,noexec,nosuid,uid=1000,gid=1000,mode=0700
      - /data:size=8m,noexec,nosuid,uid=1000,gid=1000,mode=0700
      - /tmp:size=8m,noexec,nosuid,uid=1000,gid=1000,mode=0700
    cap_drop: ["ALL"]
    <<: *service-security
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - backend
    logging: *service-logging

  web-console:
    build:
      context: ../..
      dockerfile: apps/web-console/Dockerfile
      args:
        VITE_AUTH_MODE: ${VULNLAB_AUTH_MODE:-compatibility}
        VITE_OIDC_AUTHORITY: ${VULNLAB_OIDC_ISSUER:-http://127.0.0.1:8081/realms/vulnlab-development}
        VITE_OIDC_CLIENT_ID: vulnlab-web-console
        VITE_OIDC_SCOPE: openid profile email
        VITE_OIDC_ACR_VALUES: ${VULNLAB_OIDC_REQUIRED_ACR:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,uid=101,gid=101,mode=0700
      - /var/cache/nginx:size=16m,noexec,nosuid,uid=101,gid=101,mode=0700
      - /var/run:size=1m,noexec,nosuid,uid=101,gid=101,mode=0700
    cap_drop: ["ALL"]
    <<: *service-security
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
    logging: *service-logging

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      VULNLAB_ENV: ${VULNLAB_ENV:-development}
      VULNLAB_ADMIN_KEY: ${VULNLAB_ADMIN_KEY:?set VULNLAB_ADMIN_KEY in the platform env file}
      VULNLAB_MASTER_KEY: ${VULNLAB_MASTER_KEY:?set VULNLAB_MASTER_KEY in the platform env file}
      VULNLAB_DB_PATH: /data/vulnlab.db
      VULNLAB_WORKSPACE_ROOT: /data/workspaces
      VULNLAB_EXECUTION_MODE: ${VULNLAB_EXECUTION_MODE:-dry_run}
      VULNLAB_LEGACY_EXECUTION_ENABLED: ${VULNLAB_LEGACY_EXECUTION_ENABLED:-false}
      VULNLAB_AUTH_MODE: ${VULNLAB_AUTH_MODE:-compatibility}
      VULNLAB_OIDC_ISSUER: ${VULNLAB_OIDC_ISSUER:-http://127.0.0.1:8081/realms/vulnlab-development}
      VULNLAB_OIDC_AUDIENCE: ${VULNLAB_OIDC_AUDIENCE:-vulnlab-control-plane}
      VULNLAB_OIDC_JWKS_URL: ${VULNLAB_OIDC_JWKS_URL:-http://keycloak:8080/realms/vulnlab-development/protocol/openid-connect/certs}
      VULNLAB_OIDC_TENANT_CLAIM: ${VULNLAB_OIDC_TENANT_CLAIM:-tenant_id}
      VULNLAB_OIDC_REQUIRED_ACR: ${VULNLAB_OIDC_REQUIRED_ACR:-}
      VULNLAB_OIDC_LEEWAY_SECONDS: ${VULNLAB_OIDC_LEEWAY_SECONDS:-30}
      VULNLAB_DATABASE_POOL_MIN_SIZE: ${VULNLAB_DATABASE_POOL_MIN_SIZE:-1}
      VULNLAB_DATABASE_POOL_MAX_SIZE: ${VULNLAB_DATABASE_POOL_MAX_SIZE:-8}
      VULNLAB_DATABASE_POOL_TIMEOUT_SECONDS: ${VULNLAB_DATABASE_POOL_TIMEOUT_SECONDS:-10}
      VULNLAB_ALLOWED_HOSTS: ${VULNLAB_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      VULNLAB_ALLOWED_PORTS: ${VULNLAB_ALLOWED_PORTS:-80,443,8000,8080}
      VULNLAB_ALLOW_PRIVATE_NETWORKS: "false"
      DATABASE_URL: postgresql://vulnlab_app:${PLATFORM_POSTGRES_APP_PASSWORD:?set PLATFORM_POSTGRES_APP_PASSWORD}@postgres:5432/${PLATFORM_POSTGRES_DB:?set PLATFORM_POSTGRES_DB}
      REDIS_URL: redis://:${PLATFORM_REDIS_PASSWORD:?set PLATFORM_REDIS_PASSWORD}@redis:6379/0
      NATS_URL: nats://${PLATFORM_NATS_USER:?set PLATFORM_NATS_USER}:${PLATFORM_NATS_PASSWORD:?set PLATFORM_NATS_PASSWORD}@nats:4222
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${PLATFORM_MINIO_ROOT_USER:?set PLATFORM_MINIO_ROOT_USER}
      S3_SECRET_KEY: ${PLATFORM_MINIO_ROOT_PASSWORD:?set PLATFORM_MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: vulnlab-control-plane
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    volumes:
      - api-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    <<: *service-security
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend
    logging: *service-logging

  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:?set PLATFORM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?set PLATFORM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:?set PLATFORM_POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    <<: *service-security
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    logging: *service-logging

  postgres-migrate:
    image: postgres:17.4-alpine
    user: postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:?set PLATFORM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?set PLATFORM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:?set PLATFORM_POSTGRES_DB}
      PLATFORM_POSTGRES_APP_PASSWORD: ${PLATFORM_POSTGRES_APP_PASSWORD:?set PLATFORM_POSTGRES_APP_PASSWORD}
    entrypoint: ["/bin/sh", "/usr/local/bin/migrate.sh"]
    command: []
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
      - ../postgres/migrate.sh:/usr/local/bin/migrate.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: ["ALL"]
    <<: *service-security
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    restart: "no"
    networks:
      - backend
    logging: *service-logging

  redis:
    image: redis:7.4.2-alpine
    # The image seeds /data for uid/gid 999:1000. Running as that account keeps
    # cap_drop=ALL compatible with AOF persistence on a fresh named volume.
    user: "999:1000"
    environment:
      REDIS_PASSWORD: ${PLATFORM_REDIS_PASSWORD:?set PLATFORM_REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --save 300 10 --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop: ["ALL"]
    <<: *service-security
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    logging: *service-logging

  nats:
    image: nats:2.10.26-alpine
    environment:
      NATS_USER: ${PLATFORM_NATS_USER:?set PLATFORM_NATS_USER}
      NATS_PASSWORD: ${PLATFORM_NATS_PASSWORD:?set PLATFORM_NATS_PASSWORD}
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats-data:/data
      - ../nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop: ["ALL"]
    <<: *service-security
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    logging: *service-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${PLATFORM_MINIO_ROOT_USER:?set PLATFORM_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${PLATFORM_MINIO_ROOT_PASSWORD:?set PLATFORM_MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    ports:
      - "${PLATFORM_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_MINIO_CONSOLE_PORT:-9001}:9001"
    <<: *service-security
    pids_limit: 128
    mem_limit: 768m
    cpus: 0.75
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - management
    logging: *service-logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${PLATFORM_MINIO_ROOT_USER:?set PLATFORM_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${PLATFORM_MINIO_ROOT_PASSWORD:?set PLATFORM_MINIO_ROOT_PASSWORD}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set platform http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        for bucket in artifacts reports audit; do
          mc mb --ignore-existing "platform/$$bucket";
          mc version enable "platform/$$bucket";
          mc anonymous set none "platform/$$bucket";
        done
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop: ["ALL"]
    <<: *service-security
    restart: "no"
    networks:
      - backend
    logging: *service-logging

  otel-collector:
    build:
      context: ../..
      dockerfile: infrastructure/docker/otel-collector.Dockerfile
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      VULNLAB_ENV: ${VULNLAB_ENV:-development}
    volumes:
      - ../monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: ["ALL"]
    <<: *service-security
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    logging: *service-logging

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PLATFORM_METRICS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
      - ../monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "${PLATFORM_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: ["ALL"]
    <<: *service-security
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      otel-collector:
        condition: service_healthy
    networks:
      - backend
      - management
    logging: *service-logging

  keycloak:
    profiles: ["identity"]
    image: quay.io/keycloak/keycloak:26.1.4
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${PLATFORM_KEYCLOAK_ADMIN_USER:?set PLATFORM_KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PLATFORM_KEYCLOAK_ADMIN_PASSWORD:?set PLATFORM_KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:${PLATFORM_KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        case "$$KC_BOOTSTRAP_ADMIN_PASSWORD" in
          GENERATE_*|CHANGE_ME*|CHANGE-ME*|REPLACE_ME*|REPLACE-ME*)
            echo 'Keycloak bootstrap password is still a placeholder' >&2;
            exit 64;;
        esac;
        if [ "$${#KC_BOOTSTRAP_ADMIN_PASSWORD}" -lt 24 ]; then
          echo 'Keycloak bootstrap password must contain at least 24 characters' >&2;
          exit 64;
        fi;
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak/realm-vulnlab-development.json:/opt/keycloak/data/import/realm-vulnlab-development.json:ro
    ports:
      - "${PLATFORM_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_KEYCLOAK_PORT:-8081}:8080"
    cap_drop: ["ALL"]
    <<: *service-security
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'HEAD /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - backend
      - management
    logging: *service-logging

  volume-backup:
    profiles: ["tools"]
    image: alpine:3.21.3
    entrypoint: ["/bin/sh", "/usr/local/bin/volume-backup.sh"]
    command: []
    volumes:
      - api-data:/volumes/api:ro
      - redis-data:/volumes/redis:ro
      - nats-data:/volumes/nats:ro
      - minio-data:/volumes/minio:ro
      - ../scripts/volume-backup.sh:/usr/local/bin/volume-backup.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    network_mode: none
    cap_drop: ["ALL"]
    # Read-only maintenance container must traverse service-owned 0700/0600
    # volume content (for example Redis AOF files) without changing ownership.
    cap_add: ["DAC_READ_SEARCH"]
    <<: *service-security

  volume-restore:
    profiles: ["tools"]
    image: alpine:3.21.3
    entrypoint: ["/bin/sh", "/usr/local/bin/volume-restore.sh"]
    command: []
    volumes:
      - api-data:/volumes/api
      - redis-data:/volumes/redis
      - nats-data:/volumes/nats
      - minio-data:/volumes/minio
      - ../scripts/volume-restore.sh:/usr/local/bin/volume-restore.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    network_mode: none
    cap_drop: ["ALL"]
    # Restore must replace files owned by the non-root service accounts and
    # preserve archive ownership; it remains networkless and profile-gated.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    <<: *service-security

volumes:
  api-data:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  prometheus-data:
  keycloak-data:

networks:
  edge:
  management:
  backend:
    internal: true
