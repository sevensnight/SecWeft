name: P0/P1 engineering baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      p12r_runtime:
        description: Run P12-R isolated kind/k3d runtime acceptance
        required: false
        default: false
        type: boolean
      confirm_isolated_runtime:
        description: Type RUN_P12_ISOLATED_RUNTIME to allow the destructive isolated runtime job
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: p1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python 3.12 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p1-ci-postgres-owner-password
          POSTGRES_DB: vulnlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vulnlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q apps/control-plane/src solve_module2.py solve_p0_baseline.py solve_p1_baseline.py
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy apps/control-plane/src
      - run: mkdir -p work/test-results
      - run: python -m pytest -q -p no:cacheprovider --junitxml=work/test-results/python.xml
      - name: P1 PostgreSQL, RLS, repository, and API integration
        env:
          P1_POSTGRES_ADMIN_DSN: postgresql://postgres:p1-ci-postgres-owner-password@127.0.0.1:5432/vulnlab
          P1_POSTGRES_APP_DSN: postgresql://vulnlab_app:p1-ci-postgres-app-password@127.0.0.1:5432/vulnlab
          P1_POSTGRES_APP_PASSWORD: p1-ci-postgres-app-password
        run: |
          python tools/p1/validate_enterprise_postgres.py
          python -m pytest -q -p no:cacheprovider tests/integration/test_p1_enterprise_api.py
      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: work/test-results/python.xml
          if-no-files-found: error
          retention-days: 7

  workspace:
    name: TypeScript workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - name: Generated contract types are reproducible
        run: git diff --exit-code -- packages/shared-types/src/api.generated.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Upload console bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-console-dist
          path: apps/web-console/dist
          if-no-files-found: error
          retention-days: 7

  identity-integration:
    name: Keycloak Authorization Code and PKCE
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vulnlab/web-console exec playwright install --with-deps chromium
      - name: Start isolated Keycloak realm
        run: |
          docker run --detach --name vulnlab-p1-keycloak \
            --publish 127.0.0.1:8081:8080 \
            --env KC_BOOTSTRAP_ADMIN_USERNAME=vulnlab-ci-admin \
            --env KC_BOOTSTRAP_ADMIN_PASSWORD=p1-ci-keycloak-admin-password-2026 \
            --env KC_HEALTH_ENABLED=true \
            --env KC_HTTP_ENABLED=true \
            --env KC_HOSTNAME=http://127.0.0.1:8081 \
            --volume "$PWD/infrastructure/keycloak/realm-vulnlab-development.json:/opt/keycloak/data/import/realm-vulnlab-development.json:ro" \
            quay.io/keycloak/keycloak:26.1.4 start-dev --import-realm
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8081/realms/vulnlab-development/.well-known/openid-configuration \
              >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs vulnlab-p1-keycloak
          exit 1
      - name: Validate OIDC claims, rotation, JWKS, and browser code flow
        env:
          P1_KEYCLOAK_URL: http://127.0.0.1:8081
          P1_KEYCLOAK_REALM: vulnlab-development
          P1_KEYCLOAK_ADMIN_USER: vulnlab-ci-admin
          P1_KEYCLOAK_ADMIN_PASSWORD: p1-ci-keycloak-admin-password-2026
        run: node tools/p1/validate_keycloak_oidc.mjs
      - name: Stop isolated Keycloak
        if: always()
        run: docker rm --force vulnlab-p1-keycloak || true

  p9h-linux-runtime:
    name: P9-H PostgreSQL and Linux runtime hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: pnpm install --frozen-lockfile
      - name: Verify Linux Docker runtime availability
        run: |
          docker version
          docker info
      - name: Run P9-H hardening acceptance
        run: python solve_p9_hardening.py

  p12-linux-readiness:
    name: P12-R HA, scaling, and DR readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - name: Run P9-P11 compatibility baselines
        run: |
          python solve_p9_baseline.py
          python solve_p10_baseline.py
          python solve_p11_baseline.py
      - name: Run P12 full deterministic baseline
        run: python solve_p12_baseline.py --full
      - name: Validate P12 scale, DR, and chaos guarded entry points
        run: |
          python solve_p12_scale.py
          python solve_p12_disaster_recovery.py
          python solve_p12_chaos.py
      - name: Validate P12-R runtime gates fail closed without isolated runtime
        run: |
          mkdir -p work/p12r
          set +e
          python solve_p12_scale.py --runtime --namespace vulnlab --release p12 \
            --values work/p12r/missing-runtime-values.yaml \
            --report-json work/p12r/scale-precondition.json
          scale_rc=$?
          python solve_p12_disaster_recovery.py backup --runtime \
            --report-json work/p12r/dr-backup-precondition.json
          backup_rc=$?
          python solve_p12_chaos.py --runtime --all \
            --report-json work/p12r/chaos-precondition.json
          chaos_rc=$?
          set -e
          test "$scale_rc" -ne 0
          test "$backup_rc" -ne 0
          test "$chaos_rc" -ne 0
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("work/p12r").glob("*-precondition.json"):
              data = json.loads(path.read_text())
              assert data["runtime"] is True, path
              assert data["valid"] is False, path
              assert data["runtime_not_claimed"] is True, path
              assert data["summary"]["failed"] > 0, path
          PY
      - name: Upload P12-R precondition reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12r-runtime-precondition-reports
          path: work/p12r/*.json
          if-no-files-found: warn
          retention-days: 14

  p12r-linux-runtime:
    name: P12-R isolated Linux runtime acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.p12r_runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ENVIRONMENT: test
      P12_RUNTIME_ACCEPTANCE: "true"
      P12R_RUNTIME_ENV: isolated
      P12R_RUNTIME_NAMESPACE: vulnlab
      P12R_TEST_CLUSTER_MARKER: isolated-runtime
      CHAOS_ENABLED: "true"
      VULNLAB_P12_CHAOS_ACK: isolated-chaos
      VULNLAB_P12_DR_MODE: isolated
      VULNLAB_P12_DR_CONFIRM: isolated-restore
      DATABASE_URL: postgresql://vulnlab@postgres.vulnlab.svc.cluster.local:5432/vulnlab
      VULNLAB_MINIO_ENDPOINT: http://minio.vulnlab.svc.cluster.local:9000
      VULNLAB_ALLOWED_HOSTS: localhost,127.0.0.1,vulnlab.local
      IMAGE_TAG: p12r-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2
      - name: Confirm isolated runtime dispatch
        run: |
          mkdir -p work/p12r/artifacts work/p12r/private work/p12r/artifacts/pod-logs work/p12r/artifacts/p9-p14-baseline-results
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          status = {
              "status": "READINESS_COMPLETE",
              "runtime": True,
              "runtime_not_claimed": True,
              "updated_at": datetime.now(UTC).isoformat(),
          }
          Path("work/p12r/artifacts/runtime-status.json").write_text(json.dumps(status, indent=2), encoding="utf-8")
          PY
          if [ "${{ inputs.confirm_isolated_runtime }}" != "RUN_P12_ISOLATED_RUNTIME" ]; then
            python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          status = {
              "status": "RUNTIME_BLOCKED",
              "runtime": True,
              "runtime_not_claimed": True,
              "reason": "confirm_isolated_runtime input mismatch",
              "updated_at": datetime.now(UTC).isoformat(),
          }
          Path("work/p12r/artifacts/runtime-status.json").write_text(json.dumps(status, indent=2), encoding="utf-8")
          PY
            echo "confirm_isolated_runtime must equal RUN_P12_ISOLATED_RUNTIME"
            exit 1
          fi
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: pnpm install --frozen-lockfile
      - name: Require caller-provided runtime values
        run: |
          if [ -z "${P12R_RUNTIME_VALUES_B64:-}" ]; then
            echo "P12R_RUNTIME_VALUES_B64 must contain the isolated runtime Helm values file."
            echo "The runtime job intentionally fails without real PostgreSQL/NATS/MinIO/training-lab values."
            exit 1
          fi
        env:
          P12R_RUNTIME_VALUES_B64: ${{ secrets.P12R_RUNTIME_VALUES_B64 }}
      - name: Create isolated kind cluster
        run: |
          kind create cluster --name vulnlab-p12r
          kubectl cluster-info
          kubectl label node --all vulnlab.openai.local/p12-runtime=isolated --overwrite
          kubectl create namespace vulnlab
          kubectl label namespace vulnlab vulnlab.openai.local/p12-runtime=isolated --overwrite
      - name: Build and load runtime images
        run: |
          docker build -t "vulnlab/control-plane:${IMAGE_TAG}" .
          docker build -f apps/api-gateway/Dockerfile -t "vulnlab/api-gateway:${IMAGE_TAG}" .
          docker build -f apps/web-console/Dockerfile -t "vulnlab/web-console:${IMAGE_TAG}" .
          docker build -f lab/Dockerfile -t "vulnlab/local-training-lab:${IMAGE_TAG}" lab
          kind load docker-image "vulnlab/control-plane:${IMAGE_TAG}" --name vulnlab-p12r
          kind load docker-image "vulnlab/api-gateway:${IMAGE_TAG}" --name vulnlab-p12r
          kind load docker-image "vulnlab/web-console:${IMAGE_TAG}" --name vulnlab-p12r
          kind load docker-image "vulnlab/local-training-lab:${IMAGE_TAG}" --name vulnlab-p12r
      - name: Write runtime values
        run: |
          printf '%s' "$P12R_RUNTIME_VALUES_B64" | base64 -d > work/p12r/private/runtime-values.yaml
          cat >> work/p12r/private/runtime-values.yaml <<EOF
          gateway:
            image:
              repository: vulnlab/api-gateway
              tag: ${IMAGE_TAG}
          webConsole:
            image:
              repository: vulnlab/web-console
              tag: ${IMAGE_TAG}
          controlPlane:
            image:
              repository: vulnlab/control-plane
              tag: ${IMAGE_TAG}
          validationWorker:
            image:
              repository: vulnlab/control-plane
              tag: ${IMAGE_TAG}
          EOF
        env:
          P12R_RUNTIME_VALUES_B64: ${{ secrets.P12R_RUNTIME_VALUES_B64 }}
      - name: Capture environment fingerprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.p12.runtime_acceptance import environment_fingerprint

          Path("work/p12r/artifacts/environment-fingerprint.json").write_text(
              json.dumps(environment_fingerprint(), ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Mark runtime running
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          status = {
              "status": "RUNTIME_RUNNING",
              "runtime": True,
              "runtime_not_claimed": True,
              "updated_at": datetime.now(UTC).isoformat(),
          }
          Path("work/p12r/artifacts/runtime-status.json").write_text(json.dumps(status, indent=2), encoding="utf-8")
          PY
      - name: Run P12-R scale runtime acceptance
        run: |
          python solve_p12_scale.py --runtime --namespace vulnlab --release p12 \
            --values work/p12r/private/runtime-values.yaml \
            --report-json work/p12r/artifacts/scale-runtime-result.json
      - name: Run P12-R DR runtime backup
        run: python solve_p12_disaster_recovery.py backup --runtime --report-json work/p12r/artifacts/dr-backup-result.json
      - name: Run P12-R DR runtime restore
        run: |
          backup_id=$(python - <<'PY'
          from pathlib import Path

          backups = sorted(Path("infrastructure/backups").glob("*/manifest.json"))
          if not backups:
              raise SystemExit("no backup manifest found")
          print(backups[-1].parent.name)
          PY
          )
          python solve_p12_disaster_recovery.py restore --runtime --backup-id "$backup_id" \
            --report-json work/p12r/artifacts/dr-restore-result.json
      - name: Capture DR RPO/RTO and evidence consistency reports
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          artifacts = Path("work/p12r/artifacts")
          backup = json.loads((artifacts / "dr-backup-result.json").read_text(encoding="utf-8"))
          restore = json.loads((artifacts / "dr-restore-result.json").read_text(encoding="utf-8"))
          payload = {
              "status": "RUNTIME_ACCEPTED" if backup.get("valid") and restore.get("valid") else "RUNTIME_FAILED",
              "runtime": True,
              "runtime_not_claimed": not (backup.get("runtime_not_claimed") is False and restore.get("runtime_not_claimed") is False),
              "captured_at": datetime.now(UTC).isoformat(),
              "backup_summary": backup.get("summary"),
              "restore_summary": restore.get("summary"),
              "backup_checks": [check.get("name") for check in backup.get("checks", [])],
              "restore_checks": [check.get("name") for check in restore.get("checks", [])],
          }
          (artifacts / "rpo-rto-result.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          (artifacts / "evidence-consistency-result.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Run P12-R chaos runtime acceptance
        run: python solve_p12_chaos.py --runtime --all --report-json work/p12r/artifacts/chaos-runtime-result.json
      - name: Rerun P9-P14 deterministic baselines after runtime
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          artifacts = Path("work/p12r/artifacts")
          logs = artifacts / "p9-p14-baseline-results"
          logs.mkdir(parents=True, exist_ok=True)
          commands = {
              "p9-baseline-result.json": [sys.executable, "solve_p9_baseline.py", "--full"],
              "p10-baseline-result.json": [sys.executable, "solve_p10_baseline.py", "--full"],
              "p11-baseline-result.json": [sys.executable, "solve_p11_baseline.py", "--full"],
              "p12-baseline-result.json": [sys.executable, "solve_p12_baseline.py", "--full"],
              "p13-baseline-result.json": [sys.executable, "solve_p13_baseline.py", "--full", "--json"],
              "p14-baseline-result.json": [sys.executable, "solve_p14_baseline.py", "--full", "--json"],
              "p14-e2e-result.json": [sys.executable, "solve_p14_e2e.py", "--json"],
              "p14-upgrade-result.json": [sys.executable, "solve_p14_upgrade.py", "--json"],
              "p14-delivery-result.json": [sys.executable, "solve_p14_delivery.py", "--json"],
          }

          def parse_json(text):
              decoder = json.JSONDecoder()
              stripped = text.strip()
              for index in range(len(stripped) - 1, -1, -1):
                  if stripped[index] != "{":
                      continue
                  try:
                      value, end = decoder.raw_decode(stripped[index:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value, dict) and stripped[index + end :].strip() == "":
                      return value
              return None

          failures = []
          for filename, command in commands.items():
              completed = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
              (logs / filename.replace(".json", ".log")).write_text(completed.stdout, encoding="utf-8")
              payload = parse_json(completed.stdout) or {"valid": False, "error": "structured JSON result missing"}
              payload["command"] = command
              payload["exit_code"] = completed.returncode
              if completed.returncode != 0:
                  payload["valid"] = False
              (artifacts / filename).write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
              summary = payload.get("summary", {})
              failed = int(summary.get("failed", payload.get("failed", 0)) or 0) if isinstance(summary, dict) else int(payload.get("failed", 0) or 0)
              skipped = int(summary.get("skipped", payload.get("skipped", 0)) or 0) if isinstance(summary, dict) else int(payload.get("skipped", 0) or 0)
              if payload.get("valid") is not True or failed != 0 or skipped != 0:
                  failures.append(filename)
          if failures:
              raise SystemExit(f"P9-P14 deterministic regression failures: {failures}")
          PY
      - name: Capture P13 release gate and P14 production readiness
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          artifacts = Path("work/p12r/artifacts")
          source_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          required = [
              "environment-fingerprint.json",
              "scale-runtime-result.json",
              "dr-backup-result.json",
              "dr-restore-result.json",
              "chaos-runtime-result.json",
              "evidence-consistency-result.json",
              "rpo-rto-result.json",
              "p9-baseline-result.json",
              "p10-baseline-result.json",
              "p11-baseline-result.json",
              "p12-baseline-result.json",
              "p13-baseline-result.json",
              "p14-baseline-result.json",
              "p14-e2e-result.json",
              "p14-upgrade-result.json",
              "p14-delivery-result.json",
          ]
          payloads = {}
          failures = []
          for name in required:
              path = artifacts / name
              if not path.is_file():
                  failures.append(f"{name}:missing")
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              payloads[name] = payload
              summary = payload.get("summary", {})
              failed = int(summary.get("failed", payload.get("failed", 0)) or 0) if isinstance(summary, dict) else int(payload.get("failed", 0) or 0)
              skipped = int(summary.get("skipped", payload.get("skipped", 0)) or 0) if isinstance(summary, dict) else int(payload.get("skipped", 0) or 0)
              if payload.get("valid") is not True or failed != 0 or skipped != 0:
                  failures.append(f"{name}:invalid")
          accepted = not failures
          release_gate = {
              "valid": accepted,
              "runtime": True,
              "runtime_not_claimed": not accepted,
              "source_commit": source_commit,
              "evidence_source": "GITHUB_ISOLATED_RUNTIME",
              "authority_level": "authoritative",
              "critical_gates_failed": 0 if accepted else len(failures),
              "failed": len(failures),
              "skipped": 0,
              "failures": failures,
              "evaluated_at": datetime.now(UTC).isoformat(),
          }
          production_readiness = {
              "valid": accepted,
              "runtime": True,
              "runtime_not_claimed": not accepted,
              "production_ready": accepted,
              "source_commit": source_commit,
              "evidence_source": "GITHUB_ISOLATED_RUNTIME",
              "authority_level": "authoritative",
              "critical_gates_failed": 0 if accepted else len(failures),
              "failed": len(failures),
              "skipped": 0,
              "failures": failures,
              "evaluated_at": datetime.now(UTC).isoformat(),
          }
          (artifacts / "release-gate-result.json").write_text(json.dumps(release_gate, ensure_ascii=False, indent=2), encoding="utf-8")
          (artifacts / "production-readiness-result.json").write_text(json.dumps(production_readiness, ensure_ascii=False, indent=2), encoding="utf-8")
          manifest_entries = []
          for path in sorted(artifacts.rglob("*")):
              if path.is_file():
                  manifest_entries.append({
                      "path": str(path.relative_to(artifacts)),
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          manifest = {
              "schema_version": 1,
              "source_commit": source_commit,
              "github_run_id": os.getenv("GITHUB_RUN_ID"),
              "github_sha": os.getenv("GITHUB_SHA"),
              "runtime": True,
              "runtime_not_claimed": not accepted,
              "production_ready": accepted,
              "critical_gates_failed": 0 if accepted else len(failures),
              "artifacts": manifest_entries,
              "created_at": datetime.now(UTC).isoformat(),
          }
          (artifacts / "artifact-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          if not accepted:
              raise SystemExit(f"authoritative P14 runtime closure failed: {failures}")
          PY
      - name: Mark runtime accepted
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          artifacts = Path("work/p12r/artifacts")
          reports = [
              artifacts / "scale-runtime-result.json",
              artifacts / "dr-backup-result.json",
              artifacts / "dr-restore-result.json",
              artifacts / "chaos-runtime-result.json",
              artifacts / "p13-baseline-result.json",
              artifacts / "p14-baseline-result.json",
              artifacts / "p14-e2e-result.json",
              artifacts / "p14-upgrade-result.json",
              artifacts / "p14-delivery-result.json",
              artifacts / "release-gate-result.json",
              artifacts / "production-readiness-result.json",
          ]
          payloads = [json.loads(path.read_text(encoding="utf-8")) for path in reports]
          accepted = all(item.get("valid") is True for item in payloads)
          readiness = json.loads((artifacts / "production-readiness-result.json").read_text(encoding="utf-8"))
          accepted = accepted and readiness.get("production_ready") is True and readiness.get("runtime_not_claimed") is False
          status = {
              "status": "RUNTIME_ACCEPTED" if accepted else "RUNTIME_FAILED",
              "runtime": True,
              "runtime_not_claimed": not accepted,
              "production_ready": accepted,
              "updated_at": datetime.now(UTC).isoformat(),
              "reports": [str(path) for path in reports],
          }
          artifacts.joinpath("runtime-status.json").write_text(json.dumps(status, indent=2), encoding="utf-8")
          if not accepted:
              raise SystemExit("P14 authoritative runtime closure reports did not all pass")
          PY
      - name: Collect Kubernetes runtime diagnostics
        if: always()
        run: |
          helm status p12 -n vulnlab > work/p12r/artifacts/helm-status.txt 2>&1 || true
          kubectl get all -A -o wide > work/p12r/artifacts/pod-status.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > work/p12r/artifacts/kubectl-events.txt 2>&1 || true
          for pod in $(kubectl get pods -n vulnlab -o name 2>/dev/null | sed 's#pod/##'); do
            kubectl logs -n vulnlab "$pod" --all-containers=true --tail=500 > "work/p12r/artifacts/pod-logs/${pod}.log" 2>&1 || true
          done
      - name: Upload P12-R runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12r-runtime-reports
          path: work/p12r/artifacts/**
          if-no-files-found: warn
          retention-days: 30
      - name: Destroy isolated kind cluster
        if: always()
        run: kind delete cluster --name vulnlab-p12r || true

  delivery-static:
    name: Delivery manifests and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX scripts
        run: |
          for script in infrastructure/scripts/*.sh; do
            sh -n "$script"
          done
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem infrastructure/scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Validate Compose model
        run: |
          docker compose \
            --env-file infrastructure/docker-compose/.env.platform.example \
            -f infrastructure/docker-compose/platform.yml \
            config --quiet
          docker compose \
            --env-file infrastructure/docker-compose/.env.platform.example \
            -f infrastructure/docker-compose/platform.yml \
            --profile identity config --quiet
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint and render Helm chart
        run: |
          mkdir -p work
          helm lint infrastructure/kubernetes/helm/vulnlab-platform --strict
          helm template p1 infrastructure/kubernetes/helm/vulnlab-platform \
            --namespace vulnlab --set global.imagePullPolicy=Never \
            > work/rendered-vulnlab-platform.yaml
          test -s work/rendered-vulnlab-platform.yaml
      - name: Upload rendered Kubernetes manifest
        uses: actions/upload-artifact@v4
        with:
          name: rendered-kubernetes-manifest
          path: work/rendered-vulnlab-platform.yaml
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Dependency and repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip_audit -r requirements-dev.lock --strict
      - run: mkdir -p work
      # Trivy reads pnpm-lock.yaml directly. This avoids coupling the security
      # gate to npm's retired quick/full audit endpoints while retaining a
      # lockfile-based HIGH/CRITICAL vulnerability gate below.
      - name: Filesystem vulnerability scan and CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: work/sbom.cdx.json
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Enforce lockfile, secret and IaC vulnerability gate
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-sbom
          path: work/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
