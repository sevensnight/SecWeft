        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /validation-plans/{plan_id}/review:
    post:
      operationId: reviewValidationPlan
      tags: [Validation]
      summary: Approve or reject a submitted validation plan without executing it
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationPlanReview'
      responses:
        '200':
          description: Reviewed validation plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /policies/evaluate:
    post:
      operationId: evaluatePolicy
      tags: [Policies]
      summary: Evaluate a policy decision without granting capabilities
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyEvaluationRequest'
      responses:
        '200':
          description: Persisted policy decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /audit/events:
    get:
      operationId: listEnterpriseAuditEvents
      tags: [Audit]
      summary: List append-only audit events in the authorized data scope
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit event page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Compatibility authentication for P0-only migration endpoints.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OIDC access token validated against fixed RS256, issuer, audience, expiry,
        and JWKS trust anchors. Authorization comes from database role assignments.
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XProjectId:
      name: X-Project-ID
      in: header
      required: false
      description: Resource selection only; never accepted as authorization proof.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
        pattern: '^[ -~]+$'
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: End-to-end request correlation identifier
      schema:
        type: string
        format: uuid
    IdempotencyReplayed:
      description: Whether the response was replayed from a prior identical command.
      schema:
        type: string
        enum: ['true', 'false']
  responses:
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The principal lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is outside the principal data scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version, uniqueness, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Input failed schema or managed-configuration validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Provider request or token quota has been exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [detail, code, request_id, trace_id]
      properties:
        detail:
          type: string
        code:
          type: string
        request_id:
          type: [string, 'null']
          format: uuid
        trace_id:
          type: [string, 'null']
          pattern: '^[a-f0-9]{16,64}$'
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [location, message, type]
            properties:
              location:
                type: array
                items:
                  type: string
              message:
                type: string
              type:
                type: string
    SystemRequirements:
      type: object
      required: [scope, implemented, p0_migration, excluded]
      properties:
        scope:
          type: string
        implemented:
          type: object
          additionalProperties:
            type: string
        p0_migration:
          type: object
          required: [status, target, compatibility, legacy_execution_enabled]
          properties:
            status:
              type: string
            target:
              type: string
            compatibility:
              type: string
            legacy_execution_enabled:
              type: boolean
        excluded:
          type: array
          items:
            type: string
    Task:
      type: object
      required:
        - id
        - title
        - target
        - intent
        - indicators
        - scope_id
        - status
        - approval_status
        - created_by
        - assigned_skills
        - workflow_name
        - workflow_version
        - current_stage
        - pause_requested
        - cancel_requested
        - retry_count
        - max_retries
        - fencing_token
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        target:
          type: string
        intent:
          type: string
        indicators:
          type: array
          items:
            type: string
        scope_id:
          type: string
          format: uuid
        status:
          type: string
        approval_status:
          type: string
        created_by:
          type: string
          format: uuid
        assigned_skills:
          type: array
          items:
            type: string
        workflow_name:
          type: string
        workflow_version:
          type: string
        plan:
          type: [object, 'null']
          additionalProperties: true
        result:
          type: [object, 'null']
          additionalProperties: true
        error:
          type: [string, 'null']
        current_stage:
          type: [string, 'null']
        pause_requested:
          type: boolean
        cancel_requested:
          type: boolean
        retry_count:
          type: integer
          minimum: 0
        max_retries:
          type: integer
          minimum: 0
        fencing_token:
          type: integer
          minimum: 0
        stages:
          type: array
          items:
            $ref: '#/components/schemas/TaskStage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title, target, intent, scope_id]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        target: { type: string, minLength: 1, maxLength: 2048 }
        intent:
          type: string
          enum: [asset_inventory, vulnerability_validation, defensive_regression]
        indicators:
          type: array
          maxItems: 64
          items:
            type: string
        scope_id:
          type: string
          format: uuid
    TaskActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: [string, 'null']
          maxLength: 500
    TaskStage:
      type: object
      additionalProperties: false
      required:
        [id, task_id, stage_code, display_name, sequence_no, agent_name, agent_version,
         skill_name, skill_version, depends_on, status, attempt, max_attempts,
         created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        stage_code: { type: string }
        display_name: { type: string }
        sequence_no: { type: integer, minimum: 0 }
        agent_name: { type: string }
        agent_version: { type: string }
        skill_name: { type: string }
        skill_version: { type: string }
        depends_on:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [pending, ready, running, paused, succeeded, failed, skipped, cancelled, timed_out]
        attempt: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        checkpoint:
          type: [object, 'null']
          additionalProperties: true
        output:
          type: [object, 'null']
          additionalProperties: true
        error: { type: [string, 'null'] }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskExecution:
      type: object
      additionalProperties: false
      required:
        [id, task_id, worker_id, fencing_token, status, started_at, heartbeat_at,
         created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        worker_id: { type: string }
        fencing_token: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [leased, running, paused, succeeded, failed, cancelled, timed_out]
        started_at: { type: string, format: date-time }
        heartbeat_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskDeadLetter:
      type: object
      additionalProperties: false
      required: [id, task_id, queue_message_id, reason, payload, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: [string, 'null'], format: uuid }
        queue_message_id: { type: [string, 'null'] }
        reason: { type: string }
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
    ContextMessageCreate:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string, minLength: 1, maxLength: 20000 }
        visibility: { type: string, enum: [private, task], default: task }
    ContextMessage:
      type: object
      additionalProperties: false
      required:
        [id, task_id, owner_id, role, content, content_hash, visibility,
         sequence_no, token_estimate, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        visibility: { type: string, enum: [private, task] }
        sequence_no: { type: integer, minimum: 0 }
        token_estimate: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    Checkpoint:
      type: object
      additionalProperties: false
      required:
        [id, task_id, summary, state, summary_hash, state_hash, message_count,
         evidence_count, restore_policy_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        summary: { type: string }
        state:
          type: object
          additionalProperties: true
        summary_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        state_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        message_count: { type: integer, minimum: 0 }
        evidence_count: { type: integer, minimum: 0 }
        restore_policy_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { type: string, format: date-time }
    ContextRestore:
      type: object
      additionalProperties: false
      required:
        [checkpoint_id, summary, summary_hash, state_hash, restore_policy_hash,
         current_security_envelope, scope_error]
      properties:
        checkpoint_id: { type: string, format: uuid }
        summary: { type: string }
        summary_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        state_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        restore_policy_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        current_security_envelope:
          type: object
          additionalProperties: true
        scope_error: { type: [string, 'null'] }
    EvidenceCreate:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        source_type:
          type: string
          enum: [manual, rag_chunk, checkpoint, task_output]
          default: manual
        source_ref:
          type: string
          minLength: 1
          maxLength: 500
          default: manual://operator-note
        content: { type: string, minLength: 1, maxLength: 100000 }
        classification:
          type: string
          enum: [public, internal, restricted]
          default: internal
        trust:
          type: string
          enum: [untrusted_evidence_only, operator_attested, system_observed]
          default: untrusted_evidence_only
        metadata:
          type: object
          additionalProperties: true
    EvidenceItem:
      type: object
      additionalProperties: false
      required:
        [id, task_id, title, source_type, source_ref, content, content_hash,
         classification, trust, metadata, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        title: { type: string }
        source_type: { type: string, enum: [manual, rag_chunk, checkpoint, task_output] }
        source_ref: { type: string }
        content: { type: string }
        content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        classification: { type: string, enum: [public, internal, restricted] }
        trust:
          type: string
          enum: [untrusted_evidence_only, operator_attested, system_observed]
        metadata:
          type: object
          additionalProperties: true
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    KnowledgePackRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 2, maxLength: 1000 }
        top_k: { type: integer, minimum: 1, maximum: 20, default: 5 }
        include_private_context: { type: boolean, default: false }
        classifications:
          type: [array, 'null']
          items: { type: string, enum: [public, internal, restricted] }
    KnowledgePack:
      type: object
      additionalProperties: false
      required:
        [task_id, query, security_envelope, messages, latest_checkpoint,
         evidence, rag_results]
      properties:
        task_id: { type: string, format: uuid }
        query: { type: string }
        security_envelope:
          type: object
          additionalProperties: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ContextMessage'
        latest_checkpoint:
          oneOf:
            - $ref: '#/components/schemas/Checkpoint'
            - type: 'null'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
        rag_results:
          type: array
          items:
            $ref: '#/components/schemas/RAGSearchResult'
    RAGDocumentCreate:
      type: object
      additionalProperties: false
      required: [title, content, source]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 500000 }
        source: { type: string, minLength: 1, maxLength: 500 }
        classification:
          type: string
          enum: [public, internal, restricted]
          default: internal
        version: { type: string, minLength: 1, maxLength: 50, default: '1' }
        tags:
          type: array
          maxItems: 64
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
    RAGDocument:
      type: object
      additionalProperties: false
      required:
        [id, title, source, classification, version, tags, metadata,
         content_hash, chunk_count, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        source: { type: string }
        classification: { type: string, enum: [public, internal, restricted] }
        version: { type: string }
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        chunk_count: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    RAGSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 2, maxLength: 1000 }
        top_k: { type: integer, minimum: 1, maximum: 20, default: 5 }
        classifications:
          type: [array, 'null']
          items: { type: string, enum: [public, internal, restricted] }
    RAGCitation:
      type: object
      additionalProperties: false
      required: [document_id, chunk_id, source, version, content_hash, chunk_hash]
      properties:
        document_id: { type: string, format: uuid }
        chunk_id: { type: string, format: uuid }
        source: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        chunk_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
    RAGSearchResult:
      type: object
      additionalProperties: false
      required:
        [id, document_id, chunk_id, chunk_index, title, excerpt, source,
         version, classification, tags, metadata, content_hash, chunk_hash,
         score, trust, citation]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        chunk_id: { type: string, format: uuid }
        chunk_index: { type: integer, minimum: 0 }
        title: { type: string }
        excerpt: { type: string }
        source: { type: string }
        version: { type: string }
        classification: { type: string, enum: [public, internal, restricted] }
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        chunk_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        score: { type: number, minimum: 0 }
        trust: { type: string, enum: [untrusted_evidence_only] }
        citation:
          $ref: '#/components/schemas/RAGCitation'
    RAGSearchResponse:
      type: object
      additionalProperties: false
      required: [query, results]
      properties:
        query: { type: string }
        results:
          type: array
          items:
            $ref: '#/components/schemas/RAGSearchResult'
    RAGChunk:
      type: object
      additionalProperties: false
      required:
        [document_id, chunk_id, chunk_index, title, source, version,
         classification, content_hash, content, token_estimate, chunk_hash, created_at]
      properties:
        document_id: { type: string, format: uuid }
        chunk_id: { type: string, format: uuid }
        chunk_index: { type: integer, minimum: 0 }
        title: { type: string }
        source: { type: string }
        version: { type: string }
        classification: { type: string, enum: [public, internal, restricted] }
        content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        content: { type: string }
        token_estimate: { type: integer, minimum: 1 }
        chunk_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { type: string, format: date-time }
    AgentDefinitionCreate:
      type: object
      additionalProperties: false
      required: [name, description, responsibilities]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        version: { type: string, default: '1.0', minLength: 1, maxLength: 40 }
        description: { type: string, minLength: 3, maxLength: 500 }
        responsibilities:
          type: array
          minItems: 1
          maxItems: 16
          items: { type: string }
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        allowed_tools:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { type: string }
        data_scope: { type: string, enum: [task, project, tenant], default: task }
        token_budget: { type: integer, minimum: 0, maximum: 1000000, default: 2048 }
        timeout_seconds: { type: number, minimum: 1, maximum: 3600, default: 60 }
        risk_level: { type: string, enum: [low, medium, high], default: low }
        retry_policy:
          type: object
          additionalProperties: true
    AgentDefinition:
      allOf:
        - $ref: '#/components/schemas/AgentDefinitionCreate'
        - type: object
          additionalProperties: false
          required: [id, enabled, builtin, created_by, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            enabled: { type: boolean }
            builtin: { type: boolean }
            created_by: { type: [string, 'null'], format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    WorkflowStageDefinition:
      type: object
      additionalProperties: false
      required: [code, display_name, agent_name, skill_name]
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        agent_name: { type: string, minLength: 3, maxLength: 80 }
        agent_version: { type: string, default: '1.0' }
        skill_name: { type: string, minLength: 3, maxLength: 80 }
        skill_version: { type: string, default: '1.0' }
        depends_on:
          type: array
          maxItems: 16
          items: { type: string }
        max_attempts: { type: integer, minimum: 1, maximum: 10, default: 1 }
    WorkflowDefinitionCreate:
      type: object
      additionalProperties: false
      required: [name, description, stages]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        version: { type: string, default: '1.0', minLength: 1, maxLength: 40 }
        description: { type: string, minLength: 3, maxLength: 800 }
        stages:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/WorkflowStageDefinition'
    WorkflowDefinition:
      allOf:
        - $ref: '#/components/schemas/WorkflowDefinitionCreate'
        - type: object
          additionalProperties: false
          required: [id, enabled, builtin, created_by, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
