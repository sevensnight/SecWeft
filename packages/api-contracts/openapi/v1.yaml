openapi: 3.1.0
info:
  title: VulnLab Module 2 Enterprise Control Plane API
  version: 1.1.0-p1
  description: >-
    P1 contract for OIDC identity, tenant/project data scope, eight-role RBAC,
    layered configuration, and append-only audit. P0 task projections remain an
    explicitly separated API-key compatibility surface.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Tasks
  - name: Identity
  - name: Tenancy
  - name: IAM
  - name: Configuration
  - name: Audit
security:
  - ApiKeyAuth: []
paths:
  /system/requirements:
    get:
      operationId: getSystemRequirements
      tags: [System]
      summary: Return capability and migration status
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Capability status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemRequirements'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List tasks visible to the authenticated principal
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Task collection
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tasks/{task_id}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get one task projection
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/events:
    get:
      operationId: listTaskEvents
      tags: [Tasks]
      summary: List persisted task events
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Ordered event collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/events/stream:
    get:
      operationId: streamTaskEvents
      tags: [Tasks]
      summary: Stream persisted task events incrementally
      description: >-
        Server-Sent Events stream. Consumers resume with Last-Event-ID; each data field
        contains one TaskEvent JSON object. The P0 implementation tails the durable
        compatibility store and will move to NATS fan-out in P3.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/TaskId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Incremental task event stream with periodic keepalive comments
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-cache
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /session:
    get:
      operationId: getEnterpriseSession
      tags: [Identity]
      summary: Resolve the authenticated user and effective permissions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
      responses:
        '200':
          description: Server-resolved identity and authorization context
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tenants/current:
    get:
      operationId: getCurrentTenant
      tags: [Tenancy]
      summary: Return the active tenant from the verified identity context
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Current tenant
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations:
    get:
      operationId: listOrganizations
      tags: [Tenancy]
      summary: List organizations inside the effective tenant/project scope
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Organization page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createOrganization
      tags: [Tenancy]
      summary: Create an organization with an idempotent tenant-scoped command
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          description: Organization created or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /projects:
    get:
      operationId: listProjects
      tags: [Tenancy]
      summary: List projects visible through tenant or project assignments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Project page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createProject
      tags: [Tenancy]
      summary: Create a project in the authenticated tenant
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /iam/users:
    get:
      operationId: listTenantUsers
      tags: [IAM]
      summary: List tenant identity bindings
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: User page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: provisionTenantUser
      tags: [IAM]
      summary: Provision an issuer/subject binding for an existing OIDC user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProvisionCreate'
      responses:
        '201':
          description: User binding provisioned or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /iam/roles:
    get:
      operationId: listTenantRoles
      tags: [IAM]
      summary: List explicit roles and permission codes
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Role page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /iam/role-assignments:
    post:
      operationId: grantRoleAssignment
      tags: [IAM]
      summary: Grant a tenant- or project-scoped role assignment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentCreate'
      responses:
        '201':
          description: Assignment granted or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /iam/role-assignments/{assignment_id}/revoke:
    post:
      operationId: revokeRoleAssignment
      tags: [IAM]
      summary: Revoke a role assignment immediately for subsequent requests
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRevoke'
      responses:
        '200':
          description: Assignment revoked or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /config/effective:
    get:
      operationId: getEffectiveConfiguration
      tags: [Configuration]
      summary: Resolve tenant, project, and user configuration precedence
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Effective configuration and source layer for each key
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /config/{config_key}:
    put:
      operationId: putConfigurationEntry
      tags: [Configuration]
      summary: Create or version-update one managed configuration entry
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: config_key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{2,159}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigEntryUpdate'
      responses:
        '200':
          description: Configuration entry created, updated, or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /audit/events:
    get:
      operationId: listEnterpriseAuditEvents
      tags: [Audit]
      summary: List append-only audit events in the authorized data scope
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit event page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Compatibility authentication for P0-only migration endpoints.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OIDC access token validated against fixed RS256, issuer, audience, expiry,
        and JWKS trust anchors. Authorization comes from database role assignments.
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XProjectId:
      name: X-Project-ID
      in: header
      required: false
      description: Resource selection only; never accepted as authorization proof.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
        pattern: '^[ -~]+$'
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: End-to-end request correlation identifier
      schema:
        type: string
        format: uuid
    IdempotencyReplayed:
      description: Whether the response was replayed from a prior identical command.
      schema:
        type: string
        enum: ['true', 'false']
  responses:
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The principal lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is outside the principal data scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version, uniqueness, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Input failed schema or managed-configuration validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [detail, code, request_id, trace_id]
      properties:
        detail:
          type: string
        code:
          type: string
        request_id:
          type: [string, 'null']
          format: uuid
        trace_id:
          type: [string, 'null']
          pattern: '^[a-f0-9]{16,64}$'
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [location, message, type]
            properties:
              location:
                type: array
                items:
                  type: string
              message:
                type: string
              type:
                type: string
    SystemRequirements:
      type: object
      required: [scope, implemented, p0_migration, excluded]
      properties:
        scope:
          type: string
        implemented:
          type: object
          additionalProperties:
            type: string
        p0_migration:
          type: object
          required: [status, target, compatibility, legacy_execution_enabled]
          properties:
            status:
              type: string
            target:
              type: string
            compatibility:
              type: string
            legacy_execution_enabled:
              type: boolean
        excluded:
          type: array
          items:
            type: string
    Task:
      type: object
      required:
        - id
        - title
        - target
        - intent
        - indicators
        - scope_id
        - status
        - approval_status
        - created_by
        - assigned_skills
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        target:
          type: string
        intent:
          type: string
        indicators:
          type: array
          items:
            type: string
        scope_id:
          type: string
          format: uuid
        status:
          type: string
        approval_status:
          type: string
        created_by:
          type: string
          format: uuid
        assigned_skills:
          type: array
          items:
            type: string
        plan:
          type: [object, 'null']
          additionalProperties: true
        result:
          type: [object, 'null']
          additionalProperties: true
        error:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskEvent:
      type: object
      additionalProperties: false
      required: [id, event_type, payload, created_at]
      properties:
        id:
          type: integer
          minimum: 1
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    PageMeta:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more, page_size]
      properties:
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    Tenant:
      type: object
      additionalProperties: false
      required: [id, slug, display_name, status, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    OrganizationCreate:
      type: object
      additionalProperties: false
      required: [slug, display_name]
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        display_name: { type: string, minLength: 1, maxLength: 200 }
    Organization:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, slug, display_name, status, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED, DISABLED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    OrganizationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        page:
          $ref: '#/components/schemas/PageMeta'
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [slug, display_name]
      properties:
        organization_id: { type: [string, 'null'], format: uuid }
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        display_name: { type: string, minLength: 1, maxLength: 200 }
    Project:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, organization_id, slug, display_name, status,
         created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        organization_id: { type: [string, 'null'], format: uuid }
        slug: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED, DISABLED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
