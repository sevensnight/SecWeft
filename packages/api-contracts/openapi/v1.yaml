openapi: 3.1.0
info:
  title: VulnLab Module 2 Enterprise Control Plane API
  version: 1.13.0-p13
  description: P13 contract revision for release governance, supply-chain evidence,
    immutable artifact promotion, drift, rollback, and compliance packages while preserving
    P0-P12 compatibility.
servers:
- url: /api/v1
tags:
- name: System
- name: Tasks
- name: Agents
- name: Skills
- name: Knowledge
- name: Identity
- name: Models
- name: Tenancy
- name: IAM
- name: Configuration
- name: Policies
- name: Validation
- name: Audit
- name: Evaluations
- name: Releases
security:
- ApiKeyAuth: []
paths:
  /system/requirements:
    get:
      operationId: getSystemRequirements
      tags:
      - System
      summary: Return capability and migration status
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Capability status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemRequirements'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks:
    get:
      operationId: listTasks
      tags:
      - Tasks
      summary: List tasks visible to the authenticated principal
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Task collection
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTask
      tags:
      - Tasks
      summary: Create a task draft and persisted P3 workflow stages
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Created task with persisted stage plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /tasks/{task_id}:
    get:
      operationId: getTask
      tags:
      - Tasks
      summary: Get one task projection
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/events:
    get:
      operationId: listTaskEvents
      tags:
      - Tasks
      summary: List persisted task events
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Ordered event collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/events/stream:
    get:
      operationId: streamTaskEvents
      tags:
      - Tasks
      summary: Stream persisted task events incrementally
      description: Server-Sent Events stream. Consumers resume with Last-Event-ID;
        each data field contains one TaskEvent JSON object sourced from the durable
        P3 event ledger.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TaskId'
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Incremental task event stream with periodic keepalive comments
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-cache
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/stages:
    get:
      operationId: listTaskStages
      tags:
      - Tasks
      summary: List persisted task stage state for monitoring and resume
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Ordered stage collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskStage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/executions:
    get:
      operationId: listTaskExecutions
      tags:
      - Tasks
      summary: List worker execution leases and outcomes for one task
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Worker execution collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskExecution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: dispatchTaskExecution
      tags:
      - Tasks
      summary: Idempotently enqueue an approved task for asynchronous worker execution
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '202':
          description: Task accepted into the durable queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{task_id}/pause:
    post:
      operationId: pauseTask
      tags:
      - Tasks
      summary: Persist a pause request for a queued or running task
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionRequest'
      responses:
        '200':
          description: Pause request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{task_id}/resume:
    post:
      operationId: resumeTask
      tags:
      - Tasks
      summary: Resume a paused task by returning it to the durable queue
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionRequest'
      responses:
        '200':
          description: Task queued for resumed execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{task_id}/retry:
    post:
      operationId: retryTask
      tags:
      - Tasks
      summary: Retry a failed task within its persisted retry budget
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionRequest'
      responses:
        '200':
          description: Failed task requeued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /task-dead-letters:
    get:
      operationId: listTaskDeadLetters
      tags:
      - Tasks
      summary: List failed queue messages moved to the dead-letter ledger
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Dead-letter collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDeadLetter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tasks/{task_id}/context:
    get:
      operationId: listTaskContext
      tags:
      - Knowledge
      summary: List bounded task context messages visible to the principal
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TaskId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 200
      responses:
        '200':
          description: Context messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContextMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addTaskContext
      tags:
      - Knowledge
      summary: Append a scrubbed task context message
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextMessageCreate'
      responses:
        '201':
          description: Context message appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /tasks/{task_id}/checkpoints:
    get:
      operationId: listTaskCheckpoints
      tags:
      - Knowledge
      summary: List immutable task context checkpoints
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TaskId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Checkpoint collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Checkpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createTaskCheckpoint
      tags:
      - Knowledge
      summary: Persist a hashed checkpoint of context, task envelope, and evidence
        refs
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '201':
          description: Checkpoint created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/checkpoints/latest:
    get:
      operationId: getLatestTaskCheckpoint
      tags:
      - Knowledge
      summary: Return the latest task checkpoint if one exists
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Latest checkpoint or null
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Checkpoint'
                - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/context/restore:
    post:
      operationId: restoreTaskContext
      tags:
      - Knowledge
      summary: Restore a checkpoint summary without restoring execution authority
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Restored checkpoint summary and current security envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextRestore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/evidence:
    get:
      operationId: listTaskEvidence
      tags:
      - Knowledge
      summary: List classified task evidence visible to the principal
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/TaskId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
        '200':
          description: Evidence collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addTaskEvidence
      tags:
      - Knowledge
      summary: Add non-executable, classified task evidence
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceCreate'
      responses:
        '201':
          description: Evidence item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /tasks/{task_id}/knowledge-pack:
    post:
      operationId: buildTaskKnowledgePack
      tags:
      - Knowledge
      summary: Assemble read-only task context, evidence, checkpoint, and RAG citations
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgePackRequest'
      responses:
        '200':
          description: Bounded read-only knowledge pack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /rag/documents:
    post:
      operationId: ingestRagDocument
      tags:
      - Knowledge
      summary: Ingest a scrubbed classified document and deterministic chunks
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAGDocumentCreate'
      responses:
        '201':
          description: RAG document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAGDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /rag/search:
    post:
      operationId: searchRagDocuments
      tags:
      - Knowledge
      summary: Search RAG chunks after ACL pre-filtering by classification
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAGSearchRequest'
      responses:
        '200':
          description: RAG search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAGSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /rag/documents/{document_id}/chunks:
    get:
      operationId: listRagDocumentChunks
      tags:
      - Knowledge
      summary: List document chunks subject to classification ACL
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: RAG document chunks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RAGChunk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents:
    get:
      operationId: listAgents
      tags:
      - Agents
      summary: List versioned Agent definitions and runtime budgets
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Agent definition collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAgent
      tags:
      - Agents
      summary: Register a versioned Agent definition without executable upload
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinitionCreate'
      responses:
        '201':
          description: Agent definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workflows:
    get:
      operationId: listWorkflows
      tags:
      - Agents
      summary: List versioned workflow definitions
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Workflow definition collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createWorkflow
      tags:
      - Agents
      summary: Register a DAG workflow definition
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDefinitionCreate'
      responses:
        '201':
          description: Workflow definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /skills:
    get:
      operationId: listSkills
      tags:
      - Skills
      summary: List versioned Skill definitions, limits, and statistics
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Skill definition collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSkill
      tags:
      - Skills
      summary: Register a declarative Skill manifest without executable upload
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillDefinitionCreate'
      responses:
        '201':
          description: Skill definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /skills/{skill_id}/enabled:
    post:
      operationId: setSkillEnabled
