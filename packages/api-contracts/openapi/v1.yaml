openapi: 3.1.0
info:
  title: VulnLab Module 2 Enterprise Control Plane API
  version: 1.2.0-p2
  description: >-
    P2 contract for OIDC identity, tenant/project data scope, eight-role RBAC,
    layered configuration, append-only audit, and the model gateway. P0 task
    projections remain an explicitly separated API-key compatibility surface.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Tasks
  - name: Identity
  - name: Models
  - name: Tenancy
  - name: IAM
  - name: Configuration
  - name: Audit
security:
  - ApiKeyAuth: []
paths:
  /system/requirements:
    get:
      operationId: getSystemRequirements
      tags: [System]
      summary: Return capability and migration status
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Capability status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemRequirements'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List tasks visible to the authenticated principal
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Task collection
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tasks/{task_id}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get one task projection
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/events:
    get:
      operationId: listTaskEvents
      tags: [Tasks]
      summary: List persisted task events
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Ordered event collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task_id}/events/stream:
    get:
      operationId: streamTaskEvents
      tags: [Tasks]
      summary: Stream persisted task events incrementally
      description: >-
        Server-Sent Events stream. Consumers resume with Last-Event-ID; each data field
        contains one TaskEvent JSON object. The P0 implementation tails the durable
        compatibility store and will move to NATS fan-out in P3.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/TaskId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Incremental task event stream with periodic keepalive comments
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-cache
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /providers:
    get:
      operationId: listModelProviders
      tags: [Models]
      summary: List model providers without secret material
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
      responses:
        '200':
          description: Provider collection
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createModelProvider
      tags: [Models]
      summary: Create a model provider and optional write-only credential
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProviderCreate'
      responses:
        '201':
          description: Provider created without echoing secret values
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /providers/health:
    get:
      operationId: listModelProviderHealth
      tags: [Models]
      summary: List provider readiness, circuit breaker, and recent demand signals
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
      responses:
        '200':
          description: Provider health collection
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelProviderHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /providers/{provider_id}/secret:
    put:
      operationId: rotateModelProviderSecret
      tags: [Models]
      summary: Rotate or revoke the write-only credential bound to a provider
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ProviderId'
        - name: X-Provider-API-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 4096
          description: Write-only credential value. It is never returned by any API.
      responses:
        '200':
          description: Credential metadata updated without returning secret material
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /providers/{provider_id}/enabled:
    post:
      operationId: setModelProviderEnabled
      tags: [Models]
      summary: Enable or disable a provider without deleting its audit history
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ProviderId'
        - name: enabled
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Provider enabled state changed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /models/catalog:
    get:
      operationId: listModelCatalog
      tags: [Models]
      summary: List routable model instances and capabilities
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
      responses:
        '200':
          description: Model catalog
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelCatalogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /models/complete:
    post:
      operationId: createModelCompletion
      tags: [Models]
      summary: Create a non-streaming model completion through the gateway
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCompletionRequest'
      responses:
        '200':
          description: Completion with usage, cost, and allowed tool metadata
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCompletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /models/stream:
    post:
      operationId: streamModelCompletion
      tags: [Models]
      summary: Stream a model completion through Server-Sent Events
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCompletionRequest'
      responses:
        '200':
          description: Completion chunks followed by final usage metadata
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-cache
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /models/invocations:
    get:
      operationId: listModelInvocations
      tags: [Models]
      summary: List model invocation ledger entries without prompt or response bodies
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Invocation ledger entries
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelInvocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /session:
    get:
      operationId: getEnterpriseSession
      tags: [Identity]
      summary: Resolve the authenticated user and effective permissions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
      responses:
        '200':
          description: Server-resolved identity and authorization context
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tenants/current:
    get:
      operationId: getCurrentTenant
      tags: [Tenancy]
      summary: Return the active tenant from the verified identity context
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Current tenant
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations:
    get:
      operationId: listOrganizations
      tags: [Tenancy]
      summary: List organizations inside the effective tenant/project scope
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Organization page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createOrganization
      tags: [Tenancy]
      summary: Create an organization with an idempotent tenant-scoped command
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          description: Organization created or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /projects:
    get:
      operationId: listProjects
      tags: [Tenancy]
      summary: List projects visible through tenant or project assignments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XProjectId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Project page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createProject
      tags: [Tenancy]
      summary: Create a project in the authenticated tenant
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /iam/users:
    get:
      operationId: listTenantUsers
      tags: [IAM]
      summary: List tenant identity bindings
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: User page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: provisionTenantUser
      tags: [IAM]
      summary: Provision an issuer/subject binding for an existing OIDC user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProvisionCreate'
      responses:
        '201':
          description: User binding provisioned or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /iam/roles:
    get:
      operationId: listTenantRoles
      tags: [IAM]
      summary: List explicit roles and permission codes
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Role page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /iam/role-assignments:
    post:
      operationId: grantRoleAssignment
      tags: [IAM]
      summary: Grant a tenant- or project-scoped role assignment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentCreate'
      responses:
        '201':
          description: Assignment granted or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /iam/role-assignments/{assignment_id}/revoke:
    post:
      operationId: revokeRoleAssignment
      tags: [IAM]
      summary: Revoke a role assignment immediately for subsequent requests
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRevoke'
      responses:
        '200':
          description: Assignment revoked or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /config/effective:
    get:
      operationId: getEffectiveConfiguration
      tags: [Configuration]
      summary: Resolve tenant, project, and user configuration precedence
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Effective configuration and source layer for each key
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /config/{config_key}:
    put:
      operationId: putConfigurationEntry
      tags: [Configuration]
      summary: Create or version-update one managed configuration entry
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: config_key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{2,159}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigEntryUpdate'
      responses:
        '200':
          description: Configuration entry created, updated, or replayed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /audit/events:
    get:
      operationId: listEnterpriseAuditEvents
      tags: [Audit]
      summary: List append-only audit events in the authorized data scope
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit event page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Compatibility authentication for P0-only migration endpoints.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OIDC access token validated against fixed RS256, issuer, audience, expiry,
        and JWKS trust anchors. Authorization comes from database role assignments.
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XProjectId:
      name: X-Project-ID
      in: header
      required: false
      description: Resource selection only; never accepted as authorization proof.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
        pattern: '^[ -~]+$'
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: End-to-end request correlation identifier
      schema:
        type: string
        format: uuid
    IdempotencyReplayed:
      description: Whether the response was replayed from a prior identical command.
      schema:
        type: string
        enum: ['true', 'false']
  responses:
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The principal lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is outside the principal data scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version, uniqueness, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Input failed schema or managed-configuration validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Provider request or token quota has been exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [detail, code, request_id, trace_id]
      properties:
        detail:
          type: string
        code:
          type: string
        request_id:
          type: [string, 'null']
          format: uuid
        trace_id:
          type: [string, 'null']
          pattern: '^[a-f0-9]{16,64}$'
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [location, message, type]
            properties:
              location:
                type: array
                items:
                  type: string
              message:
                type: string
              type:
                type: string
    SystemRequirements:
      type: object
      required: [scope, implemented, p0_migration, excluded]
      properties:
        scope:
          type: string
        implemented:
          type: object
          additionalProperties:
            type: string
        p0_migration:
          type: object
          required: [status, target, compatibility, legacy_execution_enabled]
          properties:
            status:
              type: string
            target:
              type: string
            compatibility:
              type: string
            legacy_execution_enabled:
              type: boolean
        excluded:
          type: array
          items:
            type: string
    Task:
      type: object
      required:
        - id
        - title
        - target
        - intent
        - indicators
        - scope_id
        - status
        - approval_status
        - created_by
        - assigned_skills
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        target:
          type: string
        intent:
          type: string
        indicators:
          type: array
          items:
            type: string
        scope_id:
          type: string
          format: uuid
        status:
          type: string
        approval_status:
          type: string
        created_by:
          type: string
          format: uuid
        assigned_skills:
          type: array
          items:
            type: string
        plan:
          type: [object, 'null']
          additionalProperties: true
        result:
          type: [object, 'null']
          additionalProperties: true
        error:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskEvent:
      type: object
      additionalProperties: false
      required: [id, event_type, payload, created_at]
      properties:
        id:
          type: integer
          minimum: 1
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    PageMeta:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more, page_size]
      properties:
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    ModelProviderCreate:
      type: object
      additionalProperties: false
      required: [name, kind, model]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, enum: [mock, openai_compatible, ollama] }
        base_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        model: { type: string, minLength: 1, maxLength: 128 }
        api_key:
          type: [string, 'null']
          maxLength: 4096
          writeOnly: true
          description: Accepted only on write. Never returned by any response.
        enabled: { type: boolean, default: true }
        priority: { type: integer, minimum: 0, maximum: 10000, default: 100 }
        rate_limit_per_minute: { type: integer, minimum: 1, maximum: 10000, default: 60 }
        token_quota_per_minute: { type: integer, minimum: 128, maximum: 10000000, default: 100000 }
        timeout_seconds: { type: number, minimum: 1, maximum: 300, default: 30 }
        input_cost_per_1k: { type: number, minimum: 0, default: 0 }
        output_cost_per_1k: { type: number, minimum: 0, default: 0 }
        capabilities:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 80 }
        config:
          type: object
          additionalProperties: true
    ModelProvider:
      type: object
      additionalProperties: false
      required:
        [id, name, kind, base_url, model, has_api_key, credential_ref, enabled,
         priority, rate_limit_per_minute, token_quota_per_minute, timeout_seconds,
         input_cost_per_1k, output_cost_per_1k, capabilities, config, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [mock, openai_compatible, ollama] }
        base_url: { type: [string, 'null'], format: uri }
        model: { type: string }
        has_api_key: { type: boolean }
        credential_ref:
          type: [string, 'null']
          pattern: '^credential://provider/[0-9a-f-]+/api-key$'
          description: Non-secret reference to configured credential material.
        enabled: { type: boolean }
        priority: { type: integer }
        rate_limit_per_minute: { type: integer }
        token_quota_per_minute: { type: integer }
        timeout_seconds: { type: number }
        input_cost_per_1k: { type: number }
        output_cost_per_1k: { type: number }
        capabilities:
          type: array
          items: { type: string }
        config:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModelProviderHealth:
      type: object
      additionalProperties: false
      required:
        [provider_id, provider, model, enabled, status, failure_count,
         circuit_open, circuit_retry_after_ms, recent_request_count]
      properties:
        provider_id: { type: string, format: uuid }
        provider: { type: string }
        model: { type: string }
        enabled: { type: boolean }
        status: { type: string, enum: [ready, disabled, circuit_open] }
        failure_count: { type: integer, minimum: 0 }
        circuit_open: { type: boolean }
        circuit_retry_after_ms: { type: integer, minimum: 0 }
        recent_request_count: { type: integer, minimum: 0 }
    ModelCatalogItem:
      type: object
      additionalProperties: false
      required:
        [provider_id, provider, kind, model, enabled, priority, capabilities,
         input_cost_per_1k, output_cost_per_1k]
      properties:
        provider_id: { type: string, format: uuid }
        provider: { type: string }
        kind: { type: string, enum: [mock, openai_compatible, ollama] }
        model: { type: string }
        enabled: { type: boolean }
        priority: { type: integer }
        capabilities:
          type: array
          items: { type: string }
        input_cost_per_1k: { type: number }
        output_cost_per_1k: { type: number }
    ModelChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 50000 }
    ModelResponseFormat:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [text, json_object], default: text }
    ModelToolDefinition:
      type: object
      additionalProperties: false
      required: [name, description, input_schema]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_.-]*$'
        description: { type: string, minLength: 1, maxLength: 500 }
        input_schema:
          type: object
          additionalProperties: true
          description: JSON Schema object for tool input. Tool names are the invocation allow-list.
    ModelCompletionRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ModelChatMessage'
        purpose: { type: string, enum: [planning, summarization, reporting, tool_selection], default: planning }
        max_tokens: { type: integer, minimum: 16, maximum: 4096, default: 512 }
        response_format:
          $ref: '#/components/schemas/ModelResponseFormat'
        tools:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ModelToolDefinition'
        stream: { type: boolean, default: false }
    ModelUsage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
    ModelToolProtocol:
      type: object
      additionalProperties: false
      required: [allowed_tools, tool_calls]
      properties:
        allowed_tools:
          type: array
          uniqueItems: true
          items: { type: string }
        tool_calls:
          type: array
          description: Tool calls emitted by a provider, constrained to allowed_tools.
          items:
            type: object
            additionalProperties: true
    ModelCompletion:
      type: object
      additionalProperties: false
      required:
        [id, provider, model, purpose, content, response_format, tool_protocol,
         usage, cost_usd, failover_count, latency_ms]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        model: { type: string }
        purpose: { type: string }
        content: { type: string }
        response_format: { type: string, enum: [text, json_object] }
        tool_protocol:
          $ref: '#/components/schemas/ModelToolProtocol'
        usage:
          $ref: '#/components/schemas/ModelUsage'
        cost_usd: { type: number, minimum: 0 }
        failover_count: { type: integer, minimum: 0 }
        latency_ms: { type: integer, minimum: 0 }
    ModelInvocation:
      type: object
      additionalProperties: false
      required:
        [id, provider, model, purpose, status, usage, cost_usd, failover_count,
         structured_output, tool_count, latency_ms, error, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        model: { type: string }
        purpose: { type: string }
        status: { type: string, enum: [succeeded, failed] }
        usage:
          $ref: '#/components/schemas/ModelUsage'
        cost_usd: { type: number, minimum: 0 }
        failover_count: { type: integer, minimum: 0 }
        structured_output: { type: boolean }
        tool_count: { type: integer, minimum: 0 }
        latency_ms: { type: integer, minimum: 0 }
        error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Tenant:
      type: object
      additionalProperties: false
      required: [id, slug, display_name, status, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    OrganizationCreate:
      type: object
      additionalProperties: false
      required: [slug, display_name]
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        display_name: { type: string, minLength: 1, maxLength: 200 }
    Organization:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, slug, display_name, status, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED, DISABLED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    OrganizationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        page:
          $ref: '#/components/schemas/PageMeta'
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [slug, display_name]
      properties:
        organization_id: { type: [string, 'null'], format: uuid }
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        display_name: { type: string, minLength: 1, maxLength: 200 }
    Project:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, organization_id, slug, display_name, status,
         created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        organization_id: { type: [string, 'null'], format: uuid }
        slug: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED, DISABLED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          $ref: '#/components/schemas/PageMeta'
    UserProvisionCreate:
      type: object
      additionalProperties: false
      required: [subject, username]
      properties:
        subject: { type: string, minLength: 1, maxLength: 255 }
        username: { type: string, minLength: 1, maxLength: 128 }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
    User:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, issuer, subject, username, email, active, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        issuer: { type: string, format: uri }
        subject: { type: string }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    UserPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'
    Role:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, code, display_name, description, scope_type, system_managed,
         permissions, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        code: { type: string }
        display_name: { type: string }
        description: { type: string }
        scope_type: { type: string, enum: [TENANT, PROJECT, BOTH] }
        system_managed: { type: boolean }
        permissions:
          type: array
          items: { type: string, pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_.]*$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    RolePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        page:
          $ref: '#/components/schemas/PageMeta'
    RoleAssignmentCreate:
      type: object
      additionalProperties: false
      required: [user_id, role_code, reason]
      properties:
        user_id: { type: string, format: uuid }
        role_code: { type: string, minLength: 3, maxLength: 80 }
        project_id: { type: [string, 'null'], format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
        expires_at: { type: [string, 'null'], format: date-time }
    RoleAssignmentRevoke:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    RoleAssignment:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, project_id, user_id, role_id, role_code, granted_by, reason,
         starts_at, expires_at, revoked_at, revoked_by, revocation_reason,
         created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        project_id: { type: [string, 'null'], format: uuid }
        user_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        role_code: { type: string }
        granted_by: { type: string, format: uuid }
        reason: { type: string }
        starts_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        revoked_by: { type: [string, 'null'], format: uuid }
        revocation_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    ConfigEntryUpdate:
      type: object
      additionalProperties: false
      required: [scope_type, value]
      properties:
        scope_type: { type: string, enum: [TENANT, PROJECT, USER] }
        project_id: { type: [string, 'null'], format: uuid }
        user_id: { type: [string, 'null'], format: uuid }
        value: {}
        expected_version: { type: [integer, 'null'], minimum: 1 }
    ConfigEntry:
      type: object
      additionalProperties: false
      required:
        [id, tenant_id, project_id, user_id, scope_type, config_key, config_value,
         created_by, updated_by, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        project_id: { type: [string, 'null'], format: uuid }
        user_id: { type: [string, 'null'], format: uuid }
        scope_type: { type: string, enum: [TENANT, PROJECT, USER] }
        config_key: { type: string }
        config_value: {}
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    EffectiveConfig:
      type: object
      additionalProperties: false
      required: [values, sources]
      properties:
        values:
          type: object
          additionalProperties: true
        sources:
          type: object
          additionalProperties:
            type: string
            enum: [TENANT, PROJECT, USER]
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [id, event_id, tenant_id, project_id, actor_type, actor_user_id, action,
         resource_type, resource_id, outcome, risk_level, trace_id, request_id,
         details, previous_hash, entry_hash, occurred_at]
      properties:
        id: { type: integer, minimum: 1 }
        event_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        project_id: { type: [string, 'null'], format: uuid }
        actor_type: { type: string }
        actor_user_id: { type: [string, 'null'], format: uuid }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        outcome: { type: string, enum: [SUCCEEDED, FAILED, DENIED, CANCELLED] }
        risk_level: { type: string, enum: [R0, R1, R2, R3, R4] }
        trace_id: { type: string }
        request_id: { type: string, format: uuid }
        details: { type: object, additionalProperties: true }
        previous_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        entry_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        occurred_at: { type: string, format: date-time }
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page:
          $ref: '#/components/schemas/PageMeta'
    SessionProjectAccess:
      type: object
      additionalProperties: false
      required: [project_id, roles, permissions]
      properties:
        project_id: { type: string, format: uuid }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
    Session:
      type: object
      additionalProperties: false
      required:
        [user_id, tenant_id, username, email, tenant_status, roles, permissions, projects]
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        tenant_status: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        projects:
