components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Compatibility authentication for P0-only migration endpoints.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token validated against fixed RS256, issuer, audience,
        expiry, and JWKS trust anchors. Authorization comes from database role assignments.
  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XProjectId:
      name: X-Project-ID
      in: header
      required: false
      description: Resource selection only; never accepted as authorization proof.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
        pattern: ^[ -~]+$
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: End-to-end request correlation identifier
      schema:
        type: string
        format: uuid
    IdempotencyReplayed:
      description: Whether the response was replayed from a prior identical command.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
  responses:
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The principal lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is outside the principal data scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version, uniqueness, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Input failed schema or managed-configuration validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Provider request or token quota has been exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dependency is unavailable or the validation queue is saturated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - detail
      - code
      - request_id
      - trace_id
      properties:
        detail:
          type: string
        code:
          type: string
        request_id:
          type:
          - string
          - 'null'
          format: uuid
        trace_id:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{16,64}$
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - location
            - message
            - type
            properties:
              location:
                type: array
                items:
                  type: string
              message:
                type: string
              type:
                type: string
    SystemRequirements:
      type: object
      required:
      - scope
      - implemented
      - p0_migration
      - excluded
      properties:
        scope:
          type: string
        implemented:
          type: object
          additionalProperties:
            type: string
        p0_migration:
          type: object
          required:
          - status
          - target
          - compatibility
          - legacy_execution_enabled
          properties:
            status:
              type: string
            target:
              type: string
            compatibility:
              type: string
            legacy_execution_enabled:
              type: boolean
        excluded:
          type: array
          items:
            type: string
    Task:
      type: object
      required:
      - id
      - title
      - target
      - intent
      - indicators
      - scope_id
      - status
      - approval_status
      - created_by
      - assigned_skills
      - workflow_name
      - workflow_version
      - current_stage
      - pause_requested
      - cancel_requested
      - retry_count
      - max_retries
      - fencing_token
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        target:
          type: string
        intent:
          type: string
        indicators:
          type: array
          items:
            type: string
        scope_id:
          type: string
          format: uuid
        status:
          type: string
        approval_status:
          type: string
        created_by:
          type: string
          format: uuid
        assigned_skills:
          type: array
          items:
            type: string
        workflow_name:
          type: string
        workflow_version:
          type: string
        plan:
          type:
          - object
          - 'null'
          additionalProperties: true
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
        error:
          type:
          - string
          - 'null'
        current_stage:
          type:
          - string
          - 'null'
        pause_requested:
          type: boolean
        cancel_requested:
          type: boolean
        retry_count:
          type: integer
          minimum: 0
        max_retries:
          type: integer
          minimum: 0
        fencing_token:
          type: integer
          minimum: 0
        stages:
          type: array
          items:
            $ref: '#/components/schemas/TaskStage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskCreate:
      type: object
      additionalProperties: false
      required:
      - title
      - target
      - intent
      - scope_id
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        target:
          type: string
          minLength: 1
          maxLength: 2048
        intent:
          type: string
          enum:
          - asset_inventory
          - vulnerability_validation
          - defensive_regression
        indicators:
          type: array
          maxItems: 64
          items:
            type: string
        scope_id:
          type: string
          format: uuid
    TaskActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type:
          - string
          - 'null'
          maxLength: 500
    TaskStage:
      type: object
      additionalProperties: false
      required:
      - id
      - task_id
      - stage_code
      - display_name
      - sequence_no
      - agent_name
      - agent_version
      - skill_name
      - skill_version
      - depends_on
      - status
      - attempt
      - max_attempts
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        stage_code:
          type: string
        display_name:
          type: string
        sequence_no:
          type: integer
          minimum: 0
        agent_name:
          type: string
        agent_version:
          type: string
        skill_name:
          type: string
        skill_version:
          type: string
        depends_on:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - pending
          - ready
          - running
          - paused
          - succeeded
          - failed
          - skipped
          - cancelled
          - timed_out
        attempt:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        checkpoint:
          type:
          - object
          - 'null'
          additionalProperties: true
        output:
          type:
          - object
          - 'null'
          additionalProperties: true
        error:
          type:
          - string
          - 'null'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskExecution:
      type: object
      additionalProperties: false
      required:
      - id
      - task_id
      - worker_id
      - fencing_token
      - status
      - started_at
      - heartbeat_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        worker_id:
          type: string
        fencing_token:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - leased
          - running
          - paused
          - succeeded
          - failed
          - cancelled
          - timed_out
        started_at:
          type: string
          format: date-time
        heartbeat_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskDeadLetter:
      type: object
      additionalProperties: false
      required:
      - id
      - task_id
      - queue_message_id
      - reason
      - payload
      - created_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type:
          - string
          - 'null'
          format: uuid
        queue_message_id:
          type:
          - string
          - 'null'
        reason:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    ContextMessageCreate:
      type: object
      additionalProperties: false
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
