[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnlab-module2"
version = "1.6.0"
description = "Authorized-lab multi-model vulnerability validation orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=48.0.1,<50",
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "minio>=7.2,<8",
  "nats-py>=2.8,<3",
  "psycopg[binary,pool]>=3.3.4,<4",
  "pydantic>=2.7,<3",
  "PyJWT[crypto]>=2.13,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "pytest-asyncio>=0.23,<2"]

[project.scripts]
vulnlab = "vulnlab.main:main"

[tool.setuptools]
package-dir = {"" = "apps/control-plane/src"}

[tool.setuptools.packages.find]
where = ["apps/control-plane/src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["apps/control-plane/src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "apps/web-console", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"apps/control-plane/src/vulnlab/api/routers/*.py" = ["B008"]
"apps/control-plane/src/vulnlab/sandbox.py" = ["ASYNC109"]
"apps/control-plane/src/vulnlab/scope.py" = ["ASYNC109"]
"tests/**/*.py" = ["ASYNC109", "B017"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["^tests/", "^lab/", "^tools/"]
