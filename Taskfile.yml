version: "3"

vars:
  PYTHON: '{{default "python" .PYTHON}}'
  PLATFORM_COMPOSE: infrastructure/docker-compose/platform.yml
  PLATFORM_ENV: '{{default "infrastructure/docker-compose/.env.platform" .PLATFORM_ENV}}'
  PLATFORM_CONFIG_ENV: '{{default "infrastructure/docker-compose/.env.platform.example" .PLATFORM_CONFIG_ENV}}'

tasks:
  default:
    desc: List available engineering tasks
    cmds:
      - task --list

  bootstrap:
    desc: Install isolated Python, pnpm, generated-contract, and browser dependencies
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File infrastructure/scripts/bootstrap.ps1 -Python "{{.PYTHON}}"

  bootstrap:unix:
    desc: Install engineering dependencies on Linux or macOS
    cmds:
      - sh infrastructure/scripts/bootstrap.sh

  python:compile:
    desc: Compile Python sources without starting services
    cmds:
      - '{{.PYTHON}} -m compileall -q apps/control-plane/src apps/validation-worker solve_module2.py solve_p0_baseline.py solve_p1_baseline.py solve_p2_baseline.py solve_p3_baseline.py solve_p4_baseline.py solve_p5_baseline.py solve_p6_baseline.py solve_p7_baseline.py solve_p8_baseline.py solve_p9_baseline.py'

  python:test:
    desc: Run the Python regression suite
    cmds:
      - '{{.PYTHON}} -m pytest -q -p no:cacheprovider'

  python:format:
    desc: Check Python formatting without modifying files
    cmds:
      - '{{.PYTHON}} -m ruff format --check .'

  python:lint:
    desc: Run the Python Ruff quality and import checks
    cmds:
      - '{{.PYTHON}} -m ruff check .'

  python:mypy:
    desc: Run static typing over the control-plane package
    cmds:
      - '{{.PYTHON}} -m mypy apps/control-plane/src'

  workspace:lint:
    desc: Lint all pnpm workspace packages
    cmds:
      - pnpm lint

  workspace:typecheck:
    desc: Type-check all pnpm workspace packages
    cmds:
      - pnpm typecheck

  workspace:test:
    desc: Run all pnpm workspace unit tests
    cmds:
      - pnpm test

  workspace:build:
    desc: Build all pnpm workspace packages
    cmds:
      - pnpm build

  contracts:generate:
    desc: Generate TypeScript API types from the checked-in OpenAPI contract
    cmds:
      - pnpm generate:api

  contracts:check:
    desc: Validate contracts and ensure generated API types are committed
    cmds:
      - pnpm --filter @vulnlab/api-contracts test
      - pnpm generate:api
      - git diff --exit-code -- packages/shared-types/src/api.generated.ts

  p0:check:
    desc: Run the read-only P0 architecture and engineering baseline checks
    cmds:
      - '{{.PYTHON}} solve_p0_baseline.py'

  p0:check:full:
    desc: Run P0 checks plus all local quality and build gates
    cmds:
      - '{{.PYTHON}} solve_p0_baseline.py --full'

  p1:check:
    desc: Run the read-only P1 identity, tenancy, RBAC, configuration, and audit checks
    cmds:
      - '{{.PYTHON}} solve_p1_baseline.py'

  p1:check:full:
    desc: Run P1 checks plus all local quality and build gates
    cmds:
      - '{{.PYTHON}} solve_p1_baseline.py --full'

  p1:postgres:
    desc: Validate P1 against the explicitly configured disposable PostgreSQL test database
    cmds:
      - '{{.PYTHON}} tools/p1/validate_enterprise_postgres.py'

  p1:keycloak:
    desc: Validate P1 Code and PKCE against the explicitly configured Keycloak test instance
    cmds:
      - node tools/p1/validate_keycloak_oidc.mjs

  p1:browser:
    desc: Validate browser OIDC discovery, gateway CSP, and the PKCE authorization request
    cmds:
      - node tools/p1/validate_oidc_browser_entry.mjs

  p2:check:
    desc: Run the P2 model gateway routing, quota, and audit checks
    cmds:
      - '{{.PYTHON}} solve_p2_baseline.py'

  p2:check:full:
    desc: Run P2 checks plus all local quality and build gates
    cmds:
      - '{{.PYTHON}} solve_p2_baseline.py --full'

  p3:check:
    desc: Run the P3 durable agent orchestration checks
    cmds:
      - '{{.PYTHON}} solve_p3_baseline.py'

  p3:check:full:
    desc: Run P3 checks plus all local quality and build gates
    cmds:
      - '{{.PYTHON}} solve_p3_baseline.py --full'

  p4:check:
    desc: Run the P4 knowledge, retrieval, context, and evidence checks
    cmds:
      - '{{.PYTHON}} solve_p4_baseline.py'

  p4:check:full:
    desc: Run P4 checks plus all local quality and build gates
    cmds:
      - '{{.PYTHON}} solve_p4_baseline.py --full'

  p5:check:
    desc: Run the P5 policy decision and enforcement boundary checks
    cmds:
      - '{{.PYTHON}} solve_p5_baseline.py'

  p5:check:full:
    desc: Run P5 checks plus all local quality and build gates
    cmds:
      - '{{.PYTHON}} solve_p5_baseline.py --full'

  p6:check:
    desc: Run the P6 validation-plan approval workflow checks
    cmds:
      - '{{.PYTHON}} solve_p6_baseline.py'

  p6:check:full:
    desc: Run P6 checks plus all local quality and build gates
    cmds:
      - '{{.PYTHON}} solve_p6_baseline.py --full'

  p7:check:
    desc: Run the P7 enterprise web console route and build checks
    cmds:
      - '{{.PYTHON}} solve_p7_baseline.py'

  p7:check:full:
    desc: Run P7 checks plus all local quality and build gates
    cmds:
      - '{{.PYTHON}} solve_p7_baseline.py --full'

  p8:check:
    desc: Run the P8 operations readiness and performance smoke checks
    cmds:
      - '{{.PYTHON}} solve_p8_baseline.py'

  p8:check:full:
    desc: Run P8 checks plus all local quality, build, Compose, and Helm gates
    cmds:
      - '{{.PYTHON}} solve_p8_baseline.py --full'

  p9:check:
    desc: Run the P9 controlled validation execution-plane checks
    cmds:
      - '{{.PYTHON}} solve_p9_baseline.py'

  p9:check:full:
    desc: Run P9 checks plus broader local quality gates
    cmds:
      - '{{.PYTHON}} solve_p9_baseline.py --full'

  platform:config:
    desc: Statically validate the base and identity-profile Compose models
    cmds:
      - docker compose --env-file "{{.PLATFORM_CONFIG_ENV}}" -f "{{.PLATFORM_COMPOSE}}" config --quiet
      - docker compose --env-file "{{.PLATFORM_CONFIG_ENV}}" -f "{{.PLATFORM_COMPOSE}}" --profile identity config --quiet

  helm:lint:
    desc: Lint and render the Kubernetes delivery chart
    cmds:
      - helm lint infrastructure/kubernetes/helm/vulnlab-platform --strict
      - helm template p0 infrastructure/kubernetes/helm/vulnlab-platform --namespace vulnlab --output-dir work/helm-render

  platform:up:
    desc: Build and start the platform with validated non-placeholder secrets
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File infrastructure/scripts/start.ps1 -EnvFile "{{.PLATFORM_ENV}}"

  platform:up:unix:
    desc: Build and start the platform on Linux or macOS
    cmds:
      - sh infrastructure/scripts/start.sh "{{.PLATFORM_ENV}}"

  platform:up:identity:
    desc: Start the platform with the optional development OIDC provider
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File infrastructure/scripts/start.ps1 -EnvFile "{{.PLATFORM_ENV}}" -Identity

  platform:up:identity:unix:
    desc: Start the platform and development OIDC provider on Linux or macOS
    cmds:
      - sh infrastructure/scripts/start.sh "{{.PLATFORM_ENV}}" --identity

  platform:down:
    desc: Stop the platform without deleting persistent volumes
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File infrastructure/scripts/stop.ps1 -EnvFile "{{.PLATFORM_ENV}}"

  platform:down:unix:
    desc: Stop the platform on Linux or macOS without deleting persistent volumes
    cmds:
      - sh infrastructure/scripts/stop.sh "{{.PLATFORM_ENV}}"

  platform:down:identity:
    desc: Stop the platform including the optional development OIDC provider
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File infrastructure/scripts/stop.ps1 -EnvFile "{{.PLATFORM_ENV}}" -Identity

  platform:down:identity:unix:
    desc: Stop the platform and development OIDC provider on Linux or macOS
    cmds:
      - sh infrastructure/scripts/stop.sh "{{.PLATFORM_ENV}}" --identity

  platform:logs:
    desc: Follow platform service logs
    cmds:
      - docker compose --env-file "{{.PLATFORM_ENV}}" -f "{{.PLATFORM_COMPOSE}}" logs --follow --tail=200

  platform:backup:
    desc: Create a consistent Windows backup of platform state
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File infrastructure/scripts/backup.ps1 -EnvFile "{{.PLATFORM_ENV}}"

  platform:backup:unix:
    desc: Create a consistent Linux or macOS backup of platform state
    cmds:
      - sh infrastructure/scripts/backup.sh infrastructure/backups "{{.PLATFORM_ENV}}"

  platform:restore:
    desc: Restore Windows platform state; requires BACKUP=/absolute/path
    requires:
      vars: [BACKUP]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File infrastructure/scripts/restore.ps1 -BackupDirectory "{{.BACKUP}}" -EnvFile "{{.PLATFORM_ENV}}" -ConfirmRestore

  platform:restore:unix:
    desc: Restore Linux or macOS platform state; requires BACKUP=/absolute/path
    requires:
      vars: [BACKUP]
    cmds:
      - sh infrastructure/scripts/restore.sh --yes "{{.BACKUP}}" "{{.PLATFORM_ENV}}"

  check:
    desc: Run the complete P0-P9 static and automated validation suite
    cmds:
      - task: python:compile
      - task: python:format
      - task: python:lint
      - task: python:mypy
      - task: python:test
      - task: workspace:lint
      - task: workspace:typecheck
      - task: workspace:test
      - task: workspace:build
      - task: contracts:check
      - task: platform:config
      - task: helm:lint
      - task: p0:check
      - task: p1:check
      - task: p2:check
      - task: p3:check
      - task: p4:check
      - task: p5:check
      - task: p6:check
      - task: p7:check
      - task: p8:check
      - task: p9:check

  check:script:
    desc: Run the shared validation through the Windows script
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File infrastructure/scripts/test.ps1 -Python "{{.PYTHON}}"

  check:script:unix:
    desc: Run the shared validation through the POSIX script
    cmds:
      - sh infrastructure/scripts/test.sh
